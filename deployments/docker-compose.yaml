version: '3.8'
name: 'metrics'

services:
  postgres:
    container_name: db_metrics
    image: postgres:16.7
    environment:
      POSTGRES_DB: "metrics"
      POSTGRES_USER: "metrics"
      POSTGRES_PASSWORD: "metrics"
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ./../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready' ]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: &networks
      - metrics-network

networks:
  metrics-network:
    driver: bridge